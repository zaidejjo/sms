[workspace]
resolver = "2"
members = [
    "sms-core",
    "sms-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Zaid Ajo"]
license = "MIT"

[workspace.dependencies]
num = "0.4"
plotters = "0.3"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
lazy_static = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"